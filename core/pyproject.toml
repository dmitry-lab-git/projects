[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "0.1.0"
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "PyYAML>=6.0",
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
include = ["db_connection*"]